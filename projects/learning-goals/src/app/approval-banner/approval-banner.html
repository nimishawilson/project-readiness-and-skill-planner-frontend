<header>
  <span class="dot" aria-hidden="true"></span>
  <h2>Awaiting your approval</h2>
  <span class="tag">{{ items().length }} completed {{ items().length === 1 ? 'goal' : 'goals' }}</span>
</header>
<ul>
  @for (item of items(); track item.goal.id) {
    <li>
      <app-avatar [name]="item.member.name" size="md" />
      <div class="text">
        <strong>{{ item.goal.title }}</strong>
        <span>{{ item.member.name }} · marked complete</span>
      </div>
      @if (canAct()) {
        <div class="actions">
          <button app-button variant="outline" size="sm" type="button" (click)="sendBack.emit(item.goal.id)">Send back</button>
          <button app-button size="sm" type="button" (click)="approve.emit(item.goal.id)">
            <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 12 5 5L20 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Approve
          </button>
        </div>
      }
    </li>
  }
</ul>
