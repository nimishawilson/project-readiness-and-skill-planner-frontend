<nav class="nav" aria-label="Main">
  <a class="nav__brand" routerLink="/employees">
    <span class="nav__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1" />
        <circle cx="17" cy="9" r="2.5" />
        <path d="M17 14h1a4 4 0 0 1 4 4v1" />
      </svg>
    </span>
    <span class="nav__title">Team Skills</span>
  </a>

  <ul class="nav__links">
    @for (link of links; track link.path) {
      <li>
        <a class="nav__link" [routerLink]="link.path" routerLinkActive="nav__link--active">{{ link.label }}</a>
      </li>
    }
  </ul>

  <div class="nav__user">
    <button
      type="button"
      class="nav__user-button"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="nav__user-text">
        <span class="nav__user-name">{{ user().name }}</span>
        <span class="nav__user-role">{{ user().designation }}</span>
      </span>
      <app-avatar [name]="user().name" size="lg" tone="solid" [decorative]="true" />
    </button>

    @if (menuOpen()) {
      <div class="nav__menu" role="menu">
        <button type="button" class="nav__menu-item" role="menuitem" (click)="logout()">Logout</button>
      </div>
    }
  </div>
</nav>
